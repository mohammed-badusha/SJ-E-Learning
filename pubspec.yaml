name: quiz_arena
description: "Competitive exam practice and live quiz battles."
publish_to: 'none'
version: 0.1.1+2100

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  go_router: ^16.2.4
  supabase_flutter: ^2.12.0
  google_sign_in: ^7.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  intl: any
  file_picker: ^10.3.3
  csv: ^6.0.0
  excel: ^4.0.6
  cupertino_icons: ^1.0.8
  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  riverpod_generator: ^3.0.3
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  go_router_builder: 4.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/sj-logo-source.png
    - assets/brand/google-g.png
    - assets/arena/
    - assets/avatars/
    - assets/images/
    - assets/audio/
    - assets/fonts/Poppins-OFL.txt
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/PlusJakartaSans-OFL.txt
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
